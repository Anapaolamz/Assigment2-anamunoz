<!DOCTYPE html>
<html>
<head>
<title>Icon Template Square</title>
<style>
body {
    background-image: url('img/fondo.png');
    background-size: cover;
    background-repeat: no-repeat;
    background-position: center;
}
.row{
    margin-top:40px;
    display: flex;
    justify-content: center;
    gap: 30px;
}
.left-column{
    float:left;
    width:30%;
    margin-left:30px;
}
.center-column{
    width:30%;
    margin:auto;
}
.right-column{
    float:right;
    width:30%;
    margin:auto;
}
.image-container{
    display: table-cell;
    vertical-align: middle;
    margin: auto;
}
</style>
</head>

<body>

<div class="row">
    <div class="image-container">
        <img id="img1" src="img/icon1.png" height="200"
             onmouseover="this.src='img/c1.png';"
             onmouseout="this.src='img/icon1.png';" />
    </div>
    <div class="image-container">
        <img id="img2" src="img/icon2.png" height="200"
             onmouseover="this.src='img/c2.png';"
             onmouseout="this.src='img/icon2.png';" />
    </div>
    <div class="image-container">
        <img id="img3" src="img/icon3.png" height="200"
             onmouseover="this.src='img/c3.png';"
             onmouseout="this.src='img/icon3.png';" />
    </div>
</div>

<div class="row">
    <div class="image-container">
        <img id="img4" src="img/icon4.png" height="200" margin-right: 0px;
        
             onmouseover="this.src='img/c4.png';"
             onmouseout="this.src='img/icon4.png';" />
    </div>
    <div class="image-container">
        <img id="img5" src="img/icon5.png" height="200"
             onmouseover="this.src='img/c5.png';"
             onmouseout="this.src='img/icon5.png';" />
    </div>
     <div class="image-container">
        <img id="img6" src="img/icon6.png" height="200"
             onmouseover="this.src='img/c6.png';"
             onmouseout="this.src='img/icon6.png';" />
    </div>
</div>
<div class="row">
    <div class="image-container">
        <img id="img7" src="img/icon7.png" height="200" margin-right: 0px;
        
             onmouseover="this.src='img/c7.png';"
             onmouseout="this.src='img/icon7.png';" />
    </div>
    <div class="image-container">
        <img id="img8" src="img/icon8.png" height="200"
             onmouseover="this.src='img/c8.png';"
             onmouseout="this.src='img/icon8.png';" />
    </div>
     <div class="image-container">
        <img id="img9" src="img/icon9.png" height="200"
             onmouseover="this.src='img/c9.png';"
             onmouseout="this.src='img/icon9.png';" />
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/buzz@2.0.0/dist/buzz.min.js"></script>
<script>
var sound1 = new buzz.sound("sound/s1.mp3");
var sound2 = new buzz.sound("sound/s2.mp3");
var sound3 = new buzz.sound("sound/s3.mp3");
var sound4 = new buzz.sound("sound/s4.mp3");
var sound5 = new buzz.sound("sound/s5.mp3");
var sound6 = new buzz.sound("sound/s6.mp3");
var sound7 = new buzz.sound("sound/s7.mp3");
var sound8 = new buzz.sound("sound/s8.mp3");
var sound9 = new buzz.sound("sound/s9.mp3");


window.onload = function() {
    document.getElementById('img1').addEventListener('click', function () { sound1.play(); });
    document.getElementById('img2').addEventListener('click', function () { sound2.play(); });
    document.getElementById('img3').addEventListener('click', function () { sound3.play(); });
    document.getElementById('img4').addEventListener('click', function () { sound4.play(); });
    document.getElementById('img5').addEventListener('click', function () { sound5.play(); });
    document.getElementById('img6').addEventListener('click', function () { sound6.play(); });
    document.getElementById('img7').addEventListener('click', function () { sound7.play(); });
    document.getElementById('img8').addEventListener('click', function () { sound8.play(); });
    document.getElementById('img9').addEventListener('click', function () { sound9.play(); });
}
</script>

</body>
</html>
